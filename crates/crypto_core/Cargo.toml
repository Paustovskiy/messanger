[package]
name = "crypto_core"
version = "0.1.0"
edition = "2024"

[dependencies]

protocol = { path = "../protocol" }
rand = "0.8"
rand_core = "0.6"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
thiserror = "1"